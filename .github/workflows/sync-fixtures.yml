name: Sync fixtures

# Pulls Champions League fixtures + live scores into Supabase every 10 minutes
# via `npm run sync`. With the default `uefa` provider no football API key is
# needed — just two Supabase secrets.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          https://<ref>.supabase.co          (required)
#   SUPABASE_SECRET_KEY   sb_secret_...                      (required)
#   FOOTBALL_API_PROVIDER uefa | football-data | api-football (optional, default uefa)
#   FOOTBALL_API_KEY      only for football-data / api-football
#   FOOTBALL_API_SEASON   optional (uefa: 2027, api-football: 2026)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-fixtures
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check required secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node -e "const u=process.env.SUPABASE_URL||'',k=process.env.SUPABASE_SECRET_KEY||''; \
            console.log('SUPABASE_URL length:', u.length, u ? '(starts '+u.slice(0,20)+'…)' : '(EMPTY)'); \
            console.log('SUPABASE_SECRET_KEY length:', k.length, k ? '(starts '+k.slice(0,10)+'…)' : '(EMPTY)'); \
            if(!u||!k){console.error('>>> One or both repo secrets are missing/empty.');process.exit(1);}"
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FOOTBALL_API_PROVIDER: ${{ secrets.FOOTBALL_API_PROVIDER }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_SEASON: ${{ secrets.FOOTBALL_API_SEASON }}
