name: Sync fixtures

# Pulls Champions League fixtures + live scores into Supabase every 10 minutes.
# No Supabase CLI / Edge Function needed — this just runs `npm run sync`.
#
# Add these repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              https://<ref>.supabase.co
#   SUPABASE_SECRET_KEY       sb_secret_...   (or a service_role key)
#   FOOTBALL_API_PROVIDER     football-data | api-football
#   FOOTBALL_API_KEY          your provider key
#   FOOTBALL_API_SEASON       2026            (only needed for api-football)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-fixtures
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FOOTBALL_API_PROVIDER: ${{ secrets.FOOTBALL_API_PROVIDER }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_SEASON: ${{ secrets.FOOTBALL_API_SEASON }}
